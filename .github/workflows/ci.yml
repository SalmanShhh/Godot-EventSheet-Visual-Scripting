# Godot EventSheets CI - every gate on every push/PR, spread across parallel jobs.
#
# One job doing everything in a row took 20-26 minutes: the full suite alone was 12-14 of them and the
# whole-project standing-contracts walk another 8-9. Neither needs one machine. The suite's
# parallel-safe tests are split six ways (tests/run_tests.gd, EVENTFORGE_TEST_SHARD), the contracts
# walk the same six ways (tools/verify_sheets.gd --shard), and each matrix job runs one slice of each
# side by side. The timing tests - the ones a loaded machine fails for the wrong reason - get a job to
# themselves, and the whole-tree gates get one more. The run takes as long as its slowest job.
#
# What the split gives up is one serial process running all 800 tests, which is what once exposed a
# test leaking state into a later one; serial-suite.yml keeps that run, nightly and on demand.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes a run still going, except on main, where every commit
# keeps its own verdict so a red one can be named.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Match the version the plugin is developed + tested on (the "current iteration"). 4.7 Linux build:
  # github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
  GODOT_VERSION: "4.7"
  # How many ways the suite and the contracts walk are split. The matrix below lists 0..SHARDS-1.
  SHARDS: "6"

jobs:
  # One slice of the suite and one slice of the standing contracts, at the same time: a runner has
  # four cores and each Godot process uses one.
  shard:
    name: suite + contracts ${{ matrix.index }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot

      # The contracts walk is the guide's whole-project pre-push recipe, split. The two skips name
      # this repository's folders of GDScript that is not meant to load: tests/fixtures/ is
      # deliberately broken so the importer can be tested against it, and tests/corpus/ illustrates
      # code a reader is shown rather than code that runs. A game project needs neither. Shard 0 also
      # runs the migration check, which reads the project as one corpus.
      - name: Suite shard and contracts shard ${{ matrix.index }}/${{ env.SHARDS }}
        shell: bash
        run: |
          EVENTFORGE_TEST_SHARD="${{ matrix.index }}/${SHARDS}" \
            ~/godot/godot --headless --path . --script tests/run_tests.gd > suite.log 2>&1 &
          SUITE_PID=$!
          ~/godot/godot --headless --path . --script tools/verify_sheets.gd -- \
            --skip res://tests/fixtures/ --skip res://tests/corpus/ --shard "${{ matrix.index }}/${SHARDS}" \
            > verify.log 2>&1
          VERIFY_EXIT=$?
          # The suite ends in a known harmless segfault after its verdict, so its exit code is not the
          # answer - the verdict line is.
          wait $SUITE_PID || true
          echo "── standing contracts ──"; cat verify.log
          SUITE_OK=0
          bash .github/scripts/suite_verdict.sh suite.log "suite shard ${{ matrix.index }}/${SHARDS}" || SUITE_OK=1
          if [ $VERIFY_EXIT -ne 0 ]; then
            grep -vE '^verify:' verify.log | head -n 24 | while IFS= read -r line; do echo "::error::contracts: $line"; done
          fi
          [ $SUITE_OK -eq 0 ] && [ $VERIFY_EXIT -eq 0 ]

  # The timing tests (a *BUDGET_MS* or PARALLEL_UNSAFE constant in their own source) and the
  # shared-state tests that must run last, serially, with the machine to themselves.
  tail:
    name: suite tail (timing tests, alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Timing and shared-state tests
        shell: bash
        run: |
          EVENTFORGE_TEST_SHARD=tail ~/godot/godot --headless --path . --script tests/run_tests.gd > tail.log 2>&1 || true
          bash .github/scripts/suite_verdict.sh tail.log "suite tail"

  # The gates that read the whole tree at once.
  gates:
    name: whole-tree gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot

      - name: Import must be clean
        run: "! grep -E 'SCRIPT ERROR|Parse Error' import.log"

      - name: Project Doctor (committed generated scripts must match their sheets)
        run: ~/godot/godot --headless --path . --script tools/project_doctor.gd

      # The behaviour packs are compiler output. The verdict is a printed line rather than an exit
      # code alone, so the line is what this greps. `shell: bash` is what puts pipefail on: the default
      # shell runs with `-e` alone, so a pipe would take tee's exit code and throw away the audit's own
      # exit 1 - which it uses for problems the drifted line does not mention, an unsound successor
      # map among them. Both halves are the gate.
      - name: Behaviour packs must match their builders
        shell: bash
        run: |
          ~/godot/godot --headless --path . --script tools/audit_addons.gd 2>&1 | tee audit.log
          grep -qE 'drifted=0' audit.log

      # The nine translation CSVs are derived the same way, and the harvester APPENDS what is owed
      # rather than reporting it - so the proof is both halves: it said nothing was owed, and it
      # left the nine files untouched. A run that quietly appended a key would pass the first half.
      - name: Translations must owe nothing
        run: |
          ~/godot/godot --headless --path . --script tools/harvest_translations.gd 2>&1 | tee harvest.log
          grep -qi 'nothing owed' harvest.log
          git diff --exit-code -- addons/eventsheet/translations/
