# Godot EventSheets CI - runs the headless-safe test suite on every push/PR.
# The full suite (tests/run_tests.gd) currently ends in a known harmless segfault after
# printing its summary, so CI gates on the headless-safe runner (clean exit codes) and
# additionally greps the full suite's output for unexpected [FAIL] lines.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Match the version the plugin is developed + tested on (the "current iteration"). 4.7 Linux build:
  # github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
  GODOT_VERSION: "4.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --import --path . 2>&1 | tee import.log

      - name: Import must be clean
        run: "! grep -E 'SCRIPT ERROR|Parse Error' import.log"

      - name: Headless-safe suite (gates the build)
        run: ~/godot/godot --headless --path . --script tests/run_perf.gd

      - name: Project Doctor (committed generated scripts must match their sheets)
        run: ~/godot/godot --headless --path . --script tools/project_doctor.gd

      # The branch gate the guide hands to teams, run on this repository as the proof that the
      # recipe works. A game project runs the whole-project form (no arguments after the --); this
      # repository is not a game, and most of its .gd files are the plugin's own test harnesses and
      # build tools, with tests/fixtures/ a folder of deliberately broken GDScript that the gate
      # cannot tell from a real file. What IS content here is generated from sheets by the builders,
      # which is exactly the corpus the four checks are about. Paths are passed the way git prints
      # them, which is the same shape the pre-commit hook in the guide uses.
      - name: The standing contracts (parse, byte-exact round trip, baked locals, migration)
        run: |
          ~/godot/godot --headless --path . --script tools/verify_sheets.gd -- \
            $(git ls-files 'demo/*.gd' 'eventsheet_addons/*.gd')

      # And the WHOLE-PROJECT form, which is the one the guide prints for a pre-push hook and a
      # branch gate - run here so that recipe is exercised rather than only described. The two skips
      # name this repository's folders of GDScript that is not meant to load: tests/fixtures/ is
      # deliberately broken so the importer can be tested against it, and tests/corpus/ illustrates
      # code a reader is shown rather than code that runs. A game project needs neither.
      - name: The standing contracts, whole project (the guide's own pre-push recipe)
        run: |
          ~/godot/godot --headless --path . --script tools/verify_sheets.gd -- \
            --skip res://tests/fixtures/ --skip res://tests/corpus/

      - name: Full suite (known harmless tail segfault tolerated; zero failures expected)
        run: |
          ~/godot/godot --headless --path . --script tests/run_tests.gd 2>&1 | tee full.log || true
          # [FAIL] lines can be indented (nested reporters), and a test may print one ON PURPOSE
          # to prove the red-run report formats it - such a line names itself with the
          # deliberate_probe_not_a_failure marker and does not count. Same filter as
          # tools/run_tests_parallel.ps1 and tools/test_report.gd.
          FAILURES=$(grep -F '[FAIL]' full.log | grep -v 'deliberate_probe_not_a_failure' || true)
          echo "PASS: $(grep -cE '^\[PASS\]' full.log)  FAIL: $(printf '%s' "$FAILURES" | grep -c . || true)"
          VERDICT_OK=true
          # The verdict line is the only always-right signal: a test that crashes mid-run prints
          # zero [FAIL] lines, so the absence of failures alone does not make a run green.
          grep -qxF 'All tests passed.' full.log || VERDICT_OK=false
          if [ -z "$FAILURES" ] && $VERDICT_OK; then exit 0; fi
          # Say WHY in annotations: annotations are readable on the run page without repo
          # access, while the raw step log is not.
          if [ -n "$FAILURES" ]; then
            echo "Failures:"; echo "$FAILURES"
            # Two lines of context after each [FAIL]: tests print their expected/actual there,
            # and a summary without them cannot be diagnosed from outside the runner.
            grep -F -A 2 '[FAIL]' full.log | grep -v 'deliberate_probe_not_a_failure' | head -n 24 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          if ! $VERDICT_OK; then
            echo "::error::The 'All tests passed.' verdict never printed - the run died mid-suite."
            echo "::error::Crash sentinel last line: $(tail -n 1 .godot/test_progress/serial.log 2>/dev/null || echo 'no trail file')"
            tail -n 8 full.log | while IFS= read -r line; do echo "::error::log tail: $line"; done
          fi
          exit 1
