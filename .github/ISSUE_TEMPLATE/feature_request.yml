name: Feature request
description: Something you would like to do that you cannot do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, it is worth a look at the
        [guide for people moving from another event-sheet editor](https://github.com/SalmanShhh/Godot-EventSheet-Visual-Scripting/blob/main/docs/GUIDE-MOVING-FROM-ANOTHER-EVENT-SHEET-EDITOR.md):
        many things map to something that already exists here.
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to make?
      description: The game situation beats the abstract feature. "My boss fight needs X" is easier to design for than "add X".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you get by today?
      description: A workaround, a GDScript block, a behaviour you wrote by hand, or another tool.
  - type: input
    id: other_editor
    attributes:
      label: Does another event-sheet editor do this? What is it called there?
