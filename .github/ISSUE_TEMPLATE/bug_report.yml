name: Bug report
description: Something broke, or lost or changed something it should not have.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. A few plain answers below are usually enough for a fix.
        If the plugin opened this form for you, the three version fields are already filled in.
        Nothing else about you or your project is sent.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Say it in your own words. If a sheet or a file was changed or lost, say which and how.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked or typed, one step per line, from a new or small sheet if you can.
      placeholder: |
        1. Open a sheet
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - The sheet editor (rows, picker, dialogs, undo)
        - Opening or saving a sheet (.gd or .tres), or the files on disk
        - The generated GDScript (Code view, compile, run)
        - Project Doctor
        - Save Studio or saving and loading in a game
        - Juice Player
        - Inspector looks or Drawing Prefabs
        - Input, settings or controls
        - Behaviour packs
        - Themes or the look of the editor
        - The Manual
        - Debugging or live values
        - The MCP server
        - Something else
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: A small sheet or snippet that shows it
      description: |
        A `.gd` sheet is the easiest to share: paste it here, or paste the rows as text
        (select rows, then Copy). For a `.tres` sheet, zip it and drag the zip in.
        Leave out anything private.
      render: gdscript
  - type: input
    id: doctor_line
    attributes:
      label: Project Doctor summary line (if it is about a project check)
      description: The line that starts with "doctor:".
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: The version of EventSheets you are using. It is in the plugin's list in Project Settings > Plugins.
    validations:
      required: true
  - type: input
    id: godot_version
    attributes:
      label: Godot version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Windows, macOS, Linux, or the like.
    validations:
      required: true
